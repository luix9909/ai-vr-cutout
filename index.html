<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixed Reality – Fast 3D Person</title>
  <style>
    body { margin:0; overflow:hidden; font-family: system-ui, sans-serif; background:#000; color:#fff; }
    #ui {
      position: absolute; inset:0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      pointer-events: none; z-index: 10; background: rgba(0,0,0,0.4);
    }
    #ui > * { pointer-events: auto; }
    #upload-area {
      background: rgba(30,30,50,0.75);
      padding: 2.5rem 4.5rem; border-radius: 1rem;
      border: 3px dashed #4488ff; text-align: center;
    }
    button {
      padding: 1rem 2.5rem; font-size: 1.4rem; margin: 1rem;
      border: none; border-radius: 1rem; cursor: pointer;
      transition: all 0.2s;
    }
    #enterVR {
      background: linear-gradient(135deg, #0066ff, #00aaff);
      color: white; font-weight: 600;
      opacity: 0.45; pointer-events: none; box-shadow: 0 0 1.2rem rgba(0,100,255,0.3);
    }
    #enterVR.active {
      opacity: 1; pointer-events: auto;
      box-shadow: 0 0 2.5rem rgba(0,140,255,0.8); transform: scale(1.05);
    }
    #status { margin-top: 1.2rem; font-size: 1.25rem; text-shadow: 0 2px 6px #000; }
    #fallback {
      position: absolute; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; text-align: center; padding: 2rem; display: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="upload-area">
    <h2>Upload photo of a person</h2>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <button id="enterVR" disabled>Enter Mixed Reality</button>

  <div id="status"></div>
</div>

<div id="fallback">
  <div>
    <h2>Mixed Reality not supported</h2>
    <p>Use Meta Quest browser or ARCore Android + Chrome for best result.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
<script type="module">
// ────────────────────────────────────────────────
const REMOVE_BG_API_KEY = 'cmqBnQGpRkW2Z5R8vMbHdxFt'; // ضع مفتاحك هنا

let scene, camera, renderer, currentSession;
let personMesh = null;
const statusEl = document.getElementById('status');
const enterBtn = document.getElementById('enterVR');
const fileInput = document.getElementById('fileInput');

// ────────────────────────────────────────────────
// Init Three.js
// ────────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  scene.background = null;

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.3));
  const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
  dirLight.position.set(4, 10, 5);
  scene.add(dirLight);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ────────────────────────────────────────────────
// Super fast person check with MediaPipe Selfie Segmentation
// ────────────────────────────────────────────────
async function hasPerson(file) {
  statusEl.textContent = "Checking photo...";

  return new Promise(resolve => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width > 512 ? 512 : img.width;  // downscale for speed
      canvas.height = img.height * (canvas.width / img.width);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const selfie = new SelfieSegmentation({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}`});

      selfie.setOptions({ modelSelection: 1 }); // 1 = landscape/full body better

      selfie.onResults(results => {
        if (!results.segmentationMask) return resolve(false);

        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let count = 0;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] > 30) count++;  // threshold a bit higher for cleaner detection
        }

        const percent = count / (canvas.width * canvas.height);
        resolve(percent > 0.12);  // ~12% → sensitive but fast & reliable
      });

      await selfie.send({image: canvas});
    };
    img.src = URL.createObjectURL(file);
  });
}

// ────────────────────────────────────────────────
// remove.bg (only if person exists)
// ────────────────────────────────────────────────
async function removeBg(file) {
  statusEl.textContent = "Removing background...";

  const formData = new FormData();
  formData.append('image_file', file);
  formData.append('size', 'medium'); // faster than 'auto' or 'hd'

  try {
    const r = await fetch('https://api.remove.bg/v1.0/removebg', {
      method: 'POST',
      headers: { 'X-Api-Key': REMOVE_BG_API_KEY },
      body: formData
    });
    if (!r.ok) throw new Error();
    const blob = await r.blob();
    return URL.createObjectURL(blob);
  } catch {
    statusEl.textContent = "remove.bg failed → using original";
    return URL.createObjectURL(file);
  }
}

// ────────────────────────────────────────────────
// Fast fake depth (real MiDaS is slow first time → disabled for speed)
// ────────────────────────────────────────────────
function createFastDepthTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.4, '#c0c0c0');
  grad.addColorStop(1, '#404040');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

// ────────────────────────────────────────────────
// Upload → fast path
// ────────────────────────────────────────────────
fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  enterBtn.disabled = true;
  enterBtn.classList.remove('active');
  personMesh = null;
  statusEl.textContent = "";

  const hasP = await hasPerson(file);

  if (!hasP) {
    statusEl.textContent = "No person detected. Upload a clear photo with a person.";
    return;
  }

  const colorUrl = await removeBg(file);
  const depthTex = createFastDepthTexture();

  const colorTex = new THREE.TextureLoader().load(colorUrl, () => {
    colorTex.colorSpace = THREE.SRGBColorSpace;
  });

  const geo = new THREE.PlaneGeometry(1.3, 1.9, 64, 64); // less segments = faster
  geo.rotateX(-Math.PI / 2);

  const mat = new THREE.MeshStandardMaterial({
    map: colorTex,
    displacementMap: depthTex,
    displacementScale: 0.22,    // smaller range = less glitchy with fake depth
    displacementBias: -0.08,
    roughness: 0.75,
    metalness: 0.03,
    transparent: true,
    side: THREE.DoubleSide
  });

  personMesh = new THREE.Mesh(geo, mat);

  // quick shadow
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2, 2.2),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -0.005;
  personMesh.add(shadow);

  statusEl.textContent = "Ready in seconds! Click to enter Mixed Reality";
  enterBtn.classList.add('active');
  enterBtn.disabled = false;
});

// ────────────────────────────────────────────────
// Enter VR
// ────────────────────────────────────────────────
enterBtn.addEventListener('click', async () => {
  if (!personMesh) return alert("Upload & wait for person check first.");

  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  try {
    currentSession = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['local-floor']
    });

    renderer.xr.setSession(currentSession);
    currentSession.addEventListener('end', () => {
      currentSession = null;
      document.getElementById('ui').style.display = 'flex';
      scene.remove(personMesh);
      enterBtn.classList.remove('active');
      enterBtn.disabled = true;
    });

    document.getElementById('ui').style.display = 'none';

    personMesh.position.set(0, 0.9, -2.0);
    scene.add(personMesh);

  } catch (err) {
    alert("Start failed\n" + err.message);
  }
});

// ────────────────────────────────────────────────
function animate() {
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
}

init();
animate();

</script>
</body>
</html>
