<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fast MR – 3D Person Preview</title>
  <style>
    body { margin:0; overflow:hidden; font-family: system-ui,sans-serif; background:#000; color:#fff; }
    #ui { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; pointer-events:none; z-index:10; background:rgba(0,0,0,0.45); }
    #ui > * { pointer-events:auto; }
    #upload-area { background:rgba(25,25,45,0.8); padding:2rem 4rem; border-radius:1rem; border:3px dashed #3a8cff; text-align:center; }
    button { padding:1rem 2.2rem; font-size:1.35rem; margin:1rem; border:none; border-radius:0.9rem; cursor:pointer; transition:all 0.18s; }
    #enterVR { background:linear-gradient(135deg,#0055ee,#0099ff); color:white; font-weight:600; opacity:0.5; pointer-events:none; box-shadow:0 0 1rem rgba(0,90,255,0.4); }
    #enterVR.active { opacity:1; pointer-events:auto; box-shadow:0 0 2.2rem rgba(0,130,255,0.85); transform:scale(1.04); }
    #status { margin-top:1rem; font-size:1.2rem; text-shadow:0 2px 5px #000; }
    #fallback { position:absolute; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; font-size:1.4rem; text-align:center; padding:2rem; display:none; }
  </style>
</head>
<body>

<div id="ui">
  <div id="upload-area">
    <h2>Upload person photo</h2>
    <input type="file" id="fileInput" accept="image/*" />
  </div>
  <button id="enterVR" disabled>Enter Mixed Reality</button>
  <div id="status"></div>
</div>

<div id="fallback">
  <div>
    <h2>Mixed Reality not available here</h2>
    <p>Best on Quest browser or Android ARCore + Chrome</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
<script type="module">
// ────────────────────────────────────────────────
const REMOVE_BG_API_KEY = 'cmqBnQGpRkW2Z5R8vMbHdxFt'; // ضع مفتاح remove.bg الحقيقي هنا

let scene, camera, renderer, currentSession;
let personMesh = null;
const status = document.getElementById('status');
const btnVR = document.getElementById('enterVR');
const inputFile = document.getElementById('fileInput');

// ────────────────────────────────────────────────
function initThree() {
  scene = new THREE.Scene(); scene.background = null;
  camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.08, 180);
  camera.position.set(0,1.62,0);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(devicePixelRatio*0.92); // slight quality trade for speed
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.4));
  const sun = new THREE.DirectionalLight(0xffffe8, 2.8);
  sun.position.set(5,12,6); scene.add(sun);

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ────────────────────────────────────────────────
// Fast person check (~200–500 ms)
// ────────────────────────────────────────────────
async function quickPersonCheck(file) {
  status.textContent = "Scanning photo...";

  return new Promise(r => {
    const img = new Image();
    img.onload = async () => {
      const cw = Math.min(448, img.width); // small size = fast
      const ch = img.height * (cw / img.width);
      const cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0,0,cw,ch);

      const seg = new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}`});
      seg.setOptions({modelSelection:1});

      seg.onResults(res => {
        if (!res.segmentationMask) return r(false);
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(res.segmentationMask, 0,0,cw,ch);
        const id = ctx.getImageData(0,0,cw,ch).data;
        let px = 0;
        for (let i=3; i<id.length; i+=4) if (id[i]>40) px++;
        r( (px / (cw*ch)) > 0.11 );
      });

      await seg.send({image:cv});
    };
    img.src = URL.createObjectURL(file);
  });
}

// ────────────────────────────────────────────────
// remove.bg – only if person found
// ────────────────────────────────────────────────
async function fastRemoveBg(file) {
  status.textContent = "Cleaning background...";

  const fd = new FormData();
  fd.append('image_file', file);
  fd.append('size', 'medium'); // fastest useful size

  try {
    const res = await fetch('https://api.remove.bg/v1.0/removebg', {
      method:'POST', headers:{'X-Api-Key':REMOVE_BG_API_KEY}, body:fd
    });
    if (!res.ok) throw 1;
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } catch {
    status.textContent = "remove.bg failed – using original";
    return URL.createObjectURL(file);
  }
}

// ────────────────────────────────────────────────
// Instant fake depth (gradient) – no wait
// ────────────────────────────────────────────────
function instantDepthTex() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s/2,s/2,0, s/2,s/2,s*0.8);
  g.addColorStop(0,'#f0f0f0');
  g.addColorStop(0.5,'#a0a0a0');
  g.addColorStop(1,'#303030');
  x.fillStyle = g; x.fillRect(0,0,s,s);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true;
  return t;
}

// ────────────────────────────────────────────────
// Upload → fastest flow
// ────────────────────────────────────────────────
inputFile.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;

  btnVR.disabled = true; btnVR.classList.remove('active');
  personMesh?.remove(); personMesh = null;
  status.textContent = "";

  if (!await quickPersonCheck(f)) {
    status.textContent = "No clear person found – try another photo";
    return;
  }

  const colorURL = await fastRemoveBg(f);
  const depth = instantDepthTex();

  const color = new THREE.TextureLoader().load(colorURL, t=> t.colorSpace = THREE.SRGBColorSpace);

  const g = new THREE.PlaneGeometry(1.25, 1.85, 48, 48); // low segments = fast render
  g.rotateX(-Math.PI/2);

  const m = new THREE.MeshStandardMaterial({
    map: color,
    displacementMap: depth,
    displacementScale: 0.18,   // gentle with fake depth
    displacementBias: -0.06,
    roughness: 0.82,
    metalness: 0.02,
    transparent: true,
    side: THREE.DoubleSide
  });

  personMesh = new THREE.Mesh(g, m);

  const sh = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4,2.4),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.32})
  );
  sh.rotation.x = -Math.PI/2; sh.position.y = -0.004;
  personMesh.add(sh);

  status.textContent = "3D ready! Click to see in Mixed Reality";
  btnVR.classList.add('active');
  btnVR.disabled = false;
});

// ────────────────────────────────────────────────
// Enter VR
// ────────────────────────────────────────────────
btnVR.addEventListener('click', async () => {
  if (!personMesh) return alert("Upload photo first");

  if (!navigator.xr || !await navigator.xr.isSessionSupported('immersive-ar')) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  try {
    currentSession = await navigator.xr.requestSession('immersive-ar', {optionalFeatures:['local-floor']});
    renderer.xr.setSession(currentSession);

    currentSession.addEventListener('end', () => {
      currentSession = null;
      document.getElementById('ui').style.display = 'flex';
      personMesh?.remove();
      btnVR.classList.remove('active'); btnVR.disabled = true;
    });

    document.getElementById('ui').style.display = 'none';
    personMesh.position.set(0, 0.92, -2.1);
    scene.add(personMesh);

  } catch(e) { alert("VR start failed\n"+e.message); }
});

// ────────────────────────────────────────────────
function loop() {
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}

initThree();
loop();

</script>
</body>
</html>
