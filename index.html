<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نديم الشعر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a1f3a;
            color: #f0e8d0;
            min-height: 100vh;
            direction: rtl;
            padding-bottom: 80px; /* مساحة للفوتر الثابت */
        }

        header {
            background: #051427;
            border-bottom: 2px solid #c4a97c;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .logo {
            font-family: 'Amiri', serif;
            font-size: 2.3rem;
            color: #c4a97c;
            text-shadow: 0 0 10px rgba(196, 169, 124, 0.3);
        }

        .poets-buttons {
            display: flex;
            gap: 18px;
        }

        .poet-btn {
            background: rgba(196, 169, 124, 0.1);
            color: #c4a97c;
            border: 1px solid #c4a97c;
            padding: 8px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .poet-btn:hover, .poet-btn.active {
            background: #c4a97c;
            color: #051427;
        }

        .main-content {
            display: flex;
            gap: 30px;
            padding: 30px 30px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .poems-sidebar {
            flex: 0 0 320px;
            min-width: 320px;
        }

        .poem-preview-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .poem-preview {
            background: rgba(10, 31, 58, 0.6);
            border: 1px solid #c4a97c;
            border-radius: 10px;
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .poem-preview:hover, .poem-preview.active {
            background: rgba(196, 169, 124, 0.18);
            transform: translateX(6px);
            border-color: #d4c080;
        }

        .poem-preview h3 {
            color: #c4a97c;
            font-family: 'Amiri', serif;
            font-size: 1.55rem;
            margin-bottom: 6px;
        }

        .poem-preview p {
            color: #d0c0a0;
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .poem-viewer {
            flex: 1;
            position: relative;
        }

        .poem-container {
            background: #051427;
            border: 2px solid #c4a97c;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            min-height: 500px;
            display: none;
        }

        /* ألوان خلفية مختلفة للقصيدة فقط */
        .poem-container.theme1 { background: #0f2a47; border-color: #a68a5c; }
        .poem-container.theme2 { background: #1a0f2e; border-color: #b8975e; }
        .poem-container.theme3 { background: #001f3f; border-color: #d4af37; }
        .poem-container.theme4 { background: #0a1a2a; border-color: #c19a6b; }
        .poem-container.theme5 { background: #112233; border-color: #e0c080; }

        .poem-header {
            background: linear-gradient(90deg, #051427 0%, #0a1f3a 100%);
            padding: 28px 30px;
            text-align: center;
            border-bottom: 2px solid #c4a97c;
        }

        .poem-title {
            font-family: 'Amiri', serif;
            font-size: 3.1rem;
            color: #d4c080;
            margin-bottom: 10px;
        }

        .poem-verses {
            padding: 40px 45px;
        }

        .verse {
            font-family: 'Amiri', serif;
            font-size: 2.05rem;
            line-height: 2.45;
            text-align: right;
            margin-bottom: 28px;
            padding: 10px 25px;
            border-right: 5px solid #d4c080;
            border-radius: 6px;
            background: rgba(212, 192, 128, 0.07);
        }

        .poem-description {
            padding: 0 45px 40px;
            font-size: 1.18rem;
            line-height: 1.95;
            text-align: center;
            color: #d0c0a0;
        }

        .poem-color-options {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: row;
            gap: 12px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }

        .color-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
        }

        .color1 { background: #0f2a47; }
        .color2 { background: #1a0f2e; }
        .color3 { background: #001f3f; }
        .color4 { background: #0a1a2a; }
        .color5 { background: #112233; }

        footer {
            background: #051427;
            border-top: 2px solid #c4a97c;
            text-align: center;
            padding: 18px;
            color: #b8a070;
            font-size: 1rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 900;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.4);
        }

        @media (max-width: 992px) {
            .main-content {
                flex-direction: column;
                padding: 20px;
            }
            .poems-sidebar {
                flex: none;
                min-width: auto;
            }
            .poem-color-options {
                left: 50%;
                transform: translateX(-50%);
                top: auto;
                bottom: 100px;
                background: rgba(0,0,0,0.5);
                padding: 12px 20px;
                border-radius: 50px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">نديم الشعر</div>
        <div class="poets-buttons">
            <button class="poet-btn active" data-poet="all">جميع القصائد</button>
            <button class="poet-btn" data-poet="salman">سلمان الأحمري</button>
            <button class="poet-btn" data-poet="sal">سلمان</button>
        </div>
    </header>

    <div class="main-content">
        <div class="poems-sidebar">
            <div class="poem-preview-list" id="poemsList"></div>
        </div>

        <div class="poem-viewer">
            <div id="poemDisplay"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 نديم الشعر | جميع الحقوق محفوظة لـ waspbyte</p>
    </footer>

    <script>
        const allPoems = [
            {
                poet: "salman",
                name: "ليل الغربة",
                description: "حنين يعتصر القلب كلما طال البعد عن الأهل والديار، ويبقى الأمل معلقاً بين الذكرى واللقاء المرتقب.",
                verses: [
                    "يا دارُ أين أنتِ من عيني الثكلى",
                    "تركتكِ وتركتُ معكِ نصف روحي",
                    "في كل زاوية أراكِ وفي كل نسمة أسمع صوتكِ",
                    "غربةٌ تقتلني وأنتِ بعيدةٌ عن ناظري",
                    "والقلب يئنُّ من الشوق المستعر",
                    "ينتظر لحظةَ عودةٍ تُعيدُ له الحياة",
                    "فإن طال الفراقُ طالَ العذابُ",
                    "وإن قرُب اللقاءُ ذابَ الهمُّ والكآبة"
                ]
            },
            {
                poet: "sal",
                name: "صوت الريح",
                description: "الريح تحمل في طياتها ذكريات وأسراراً، تحدثنا عن الماضي والمستقبل.",
                verses: [
                    "تأتي الريح فتحدثني عن أيام مضت",
                    "تحمل عطر الورد والأرض بعد المطر",
                    "في صوتها حكايات لم تُروَ بعد",
                    "وأنا أصغي لها كطفلٍ يسمع حكاية قبل النوم",
                    "تهمس في أذني بأسرار الغيب",
                    "وتذكرني بأن الحياة رحلة",
                    "فاسمعها جيداً قبل أن تذهب",
                    "فالريح لا تعود إلا برسالة جديدة"
                ]
            }
            // أضف باقي القصائد هنا إذا أردت
        ];

        const poemsList = document.getElementById('poemsList');
        const poemDisplay = document.getElementById('poemDisplay');

        function renderPoems(poetFilter = 'all') {
            poemsList.innerHTML = '';
            const filtered = poetFilter === 'all' 
                ? allPoems 
                : allPoems.filter(p => p.poet === poetFilter);

            filtered.forEach(poem => {
                const preview = document.createElement('div');
                preview.className = 'poem-preview';
                preview.innerHTML = `
                    <h3>${poem.name}</h3>
                    <p>${poem.description.substring(0, 90)}...</p>
                `;
                preview.onclick = () => showPoem(poem, preview);
                poemsList.appendChild(preview);
            });
        }

        function showPoem(poem, clickedPreview) {
            document.querySelectorAll('.poem-preview').forEach(el => el.classList.remove('active'));
            clickedPreview.classList.add('active');

            poemDisplay.innerHTML = `
                <div class="poem-container theme3" id="currentPoem">
                    <div class="poem-color-options">
                        <div class="color-btn color1" data-theme="theme1"></div>
                        <div class="color-btn color2" data-theme="theme2"></div>
                        <div class="color-btn color3" data-theme="theme3"></div>
                        <div class="color-btn color4" data-theme="theme4"></div>
                        <div class="color-btn color5" data-theme="theme5"></div>
                    </div>
                    <div class="poem-header">
                        <div class="poem-title">${poem.name}</div>
                    </div>
                    <div class="poem-verses">
                        ${poem.verses.map(v => `<div class="verse">${v}</div>`).join('')}
                    </div>
                    <div class="poem-description">${poem.description}</div>
                </div>
            `;

            const container = document.getElementById('currentPoem');
            container.style.display = 'block';

            container.querySelectorAll('.color-btn').forEach(btn => {
                btn.onclick = () => {
                    container.className = 'poem-container ' + btn.dataset.theme;
                };
            });

            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        document.querySelectorAll('.poet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.poet-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                poemDisplay.innerHTML = '';
                renderPoems(btn.dataset.poet);
            });
        });

        // تهيئة
        renderPoems('all');
    </script>
</body>
</html>
