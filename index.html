<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixed Reality – Realistic 3D Person</title>
  <style>
    body { margin:0; overflow:hidden; font-family: system-ui, sans-serif; background:#000; color:#fff; }
    #ui {
      position: absolute; inset:0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      pointer-events: none; z-index: 10; background: rgba(0,0,0,0.4);
    }
    #ui > * { pointer-events: auto; }
    #upload-area {
      background: rgba(30,30,50,0.75);
      padding: 3rem 5rem; border-radius: 1.2rem;
      border: 3px dashed #4488ff; text-align: center;
    }
    button {
      padding: 1rem 2.5rem; font-size: 1.4rem; margin: 1rem;
      border: none; border-radius: 1rem; cursor: pointer;
      transition: all 0.25s;
    }
    #enterVR {
      background: linear-gradient(135deg, #0066ff, #00aaff);
      color: white; font-weight: 600;
      opacity: 0.4; pointer-events: none; box-shadow: 0 0 1.5rem rgba(0,100,255,0.4);
    }
    #enterVR.active {
      opacity: 1; pointer-events: auto;
      box-shadow: 0 0 3rem rgba(0,140,255,0.9); transform: scale(1.06);
    }
    #status { margin-top: 1.5rem; font-size: 1.3rem; text-shadow: 0 2px 8px #000; }
    #fallback {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; text-align: center; padding: 3rem; display: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="upload-area">
    <h2>Upload a clear photo of a person</h2>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <!-- زر الدخول موجود دائماً لكن معطل حتى يتم التأكد من الشخص -->
  <button id="enterVR" disabled>Enter Mixed Reality</button>

  <div id="status"></div>
</div>

<div id="fallback">
  <div>
    <h2>Immersive-AR (Mixed Reality) not supported</h2>
    <p>Best on Meta Quest 3 / Pro or ARCore Android + Chrome.<br>
    Desktop / iOS usually no full passthrough.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
<script type="module">
import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/webxr/VRButton.min.js';

// ────────────────────────────────────────────────
// Config
// ────────────────────────────────────────────────
const REMOVE_BG_API_KEY = 'cmqBnQGpRkW2Z5R8vMbHdxFt';   // ← ضع مفتاح remove.bg هنا

let scene, camera, renderer, currentSession;
let personMesh = null;
let statusEl = document.getElementById('status');
let enterBtn = document.getElementById('enterVR');
let fileInput = document.getElementById('fileInput');

// ────────────────────────────────────────────────
// Three.js + WebXR init
// ────────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  scene.background = null;

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xfff8e8, 2.5);
  dir.position.set(3, 8, 4);
  scene.add(dir);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ────────────────────────────────────────────────
// Check if person exists using MediaPipe Selfie Segmentation
// ────────────────────────────────────────────────
async function hasPersonInImage(file) {
  statusEl.textContent = "Checking for a person in the photo...";

  return new Promise((resolve) => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${file}`;
      }});

      selfieSegmentation.setOptions({
        modelSelection: 1,  // 0 = general, 1 = landscape (better for full body)
      });

      selfieSegmentation.onResults((results) => {
        if (!results.segmentationMask) {
          resolve(false);
          return;
        }

        const mask = results.segmentationMask;
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(mask, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let personPixels = 0;
        for (let i = 3; i < imageData.data.length; i += 4) {
          if (imageData.data[i] > 10) personPixels++;
        }

        const percentage = personPixels / (canvas.width * canvas.height);
        resolve(percentage > 0.15);  // أكثر من 15% من الصورة شخص → يعتبر موجود
      });

      await selfieSegmentation.send({image: img});
    };
    img.src = URL.createObjectURL(file);
  });
}

// ────────────────────────────────────────────────
// remove.bg
// ────────────────────────────────────────────────
async function removeBackground(file) {
  statusEl.textContent = "Removing background...";

  const formData = new FormData();
  formData.append('image_file', file);
  formData.append('size', 'auto');

  try {
    const res = await fetch('https://api.remove.bg/v1.0/removebg', {
      method: 'POST',
      headers: { 'X-Api-Key': REMOVE_BG_API_KEY },
      body: formData
    });

    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "remove.bg error → fallback to original";
    return URL.createObjectURL(file);
  }
}

// ────────────────────────────────────────────────
// MiDaS depth (simplified – you can expand)
// ────────────────────────────────────────────────
async function estimateDepth(imageUrl) {
  statusEl.textContent = "Estimating depth... (may take seconds)";

  // Placeholder: real MiDaS loading needs @tensorflow-models/depth-estimation
  // For brevity we simulate here – replace with real call as before
  await new Promise(r => setTimeout(r, 3000)); // simulate delay

  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0,0,512,512); // fake depth

  return new Promise(r => {
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    r(tex);
  });
}

// ────────────────────────────────────────────────
// Upload handler with person check
// ────────────────────────────────────────────────
fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  enterBtn.disabled = true;
  enterBtn.classList.remove('active');
  personMesh = null;

  const hasPerson = await hasPersonInImage(file);
  if (!hasPerson) {
    statusEl.textContent = "No person detected in the photo. Please upload a clear photo of a person.";
    return;
  }

  let colorUrl = await removeBackground(file);
  const depthTex = await estimateDepth(colorUrl);

  const colorTex = new THREE.TextureLoader().load(colorUrl, () => {
    colorTex.colorSpace = THREE.SRGBColorSpace;
  });

  const geo = new THREE.PlaneGeometry(1.4, 2.0, 128, 128);
  geo.rotateX(-Math.PI / 2);

  const mat = new THREE.MeshStandardMaterial({
    map: colorTex,
    displacementMap: depthTex,
    displacementScale: 0.35,
    displacementBias: -0.15,
    roughness: 0.7,
    metalness: 0.05,
    transparent: true,
    side: THREE.DoubleSide
  });

  personMesh = new THREE.Mesh(geo, mat);
  personMesh.scale.set(1, 1, 1);

  // shadow placeholder
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -0.01;
  personMesh.add(shadow);

  statusEl.textContent = "Ready! Click 'Enter Mixed Reality'";
  enterBtn.classList.add('active');
  enterBtn.disabled = false;
});

// ────────────────────────────────────────────────
// Enter VR
// ────────────────────────────────────────────────
enterBtn.addEventListener('click', async () => {
  if (!personMesh) return alert("Process a valid photo first.");

  if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-ar'))) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  try {
    currentSession = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['local-floor', 'hand-tracking']
    });

    renderer.xr.setSession(currentSession);
    currentSession.addEventListener('end', () => {
      currentSession = null;
      document.getElementById('ui').style.display = 'flex';
      if (personMesh) scene.remove(personMesh);
      enterBtn.classList.remove('active');
      enterBtn.disabled = true;
    });

    document.getElementById('ui').style.display = 'none';

    personMesh.position.set(0, 0.9, -2.2);
    scene.add(personMesh);

  } catch (err) {
    alert("Failed to start session\n" + err.message);
  }
});

// Render loop
function animate() {
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
}

init();
animate();

</script>
</body>
</html>
